<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusGuard — Student Wellbeing Early-Warning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <!-- Standalone React 18 & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .shadow-card { box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const translations = {
      en: {
        appName: "CampusGuard",
        tagline: "Don't wait for students to struggle in silence.",
        heroSubtitle: "An opt-in, privacy-first AI wellbeing early-warning system helping institutions detect academic overload and isolation before they escalate.",
        startCheckin: "Start Daily Check-in",
        viewDashboard: "View Wellness Dashboard",
        navOverview: "Overview",
        navCheckin: "Daily Check-in",
        navWellbeing: "My Wellbeing",
        navSupport: "Support Chat",
        navResources: "Resources",
        navPrivacy: "Privacy Center",
        navAdmin: "Admin Command",
        navCommunityGraph: "Community Graph"
      },
      hi: {
        appName: "कैंपसगार्ड (CampusGuard)",
        tagline: "छात्रों के संघर्ष में मौन रहने की प्रतीक्षा न करें।",
        heroSubtitle: "एक गोपनीयता-केंद्रित, स्वैच्छिक AI-संचालित कल्याण प्रणाली जो अत्यधिक तनाव और अकेलेपन के शुरुआती संकेत पहचानती है।",
        startCheckin: "दैनिक चेक-इन शुरू करें",
        viewDashboard: "वेलनेस डैशबोर्ड देखें",
        navOverview: "अवलोकन",
        navCheckin: "दैनिक चेक-इन",
        navWellbeing: "मेरा स्वास्थ्य",
        navSupport: "सपोर्ट चैट",
        navResources: "संसाधन",
        navPrivacy: "गोपनीयता केंद्र",
        navAdmin: "एडमिन कमांड",
        navCommunityGraph: "समुदाय ग्राफ"
      },
      mr: {
        appName: "कॅम्पसगार्ड (CampusGuard)",
        tagline: "विद्यार्थ्यांच्या संघर्षात मौन राहण्याची वाट पाहू नका.",
        heroSubtitle: "एक गोपनीयता-प्रथम, ऐच्छिक AI प्रणाली जी शैक्षणिक ताण आणि एकटेपणा संकट होण्यापूर्वी ओळखण्यास मदत करते.",
        startCheckin: "दैनिक चेक-इन सुरू करा",
        viewDashboard: "वेलनेस डॅशबोर्ड पहा",
        navOverview: "विहंगावलोकन",
        navCheckin: "दैनिक चेक-इन",
        navWellbeing: "माझे आरोग्य",
        navSupport: "सपोर्ट चॅट",
        navResources: "संसाधने",
        navPrivacy: "गोपनीयता केंद्र",
        navAdmin: "प्रशासक केंद्र",
        navCommunityGraph: "समुदाय आलेख"
      }
    };

    const INITIAL_ALERTS = [
      { id: 1, student_id: 'CG-1042', risk_score: 88, risk_level: 'High', top_factors: ['Severe sleep drop (<4.5h)', 'Extreme workload (11h)', 'Frequent isolation'], trend: 'declining', status: 'pending' },
      { id: 2, student_id: 'CG-8810', risk_score: 79, risk_level: 'High', top_factors: ['Low mood', 'Frequent isolation', 'Attendance dip (62%)'], trend: 'declining', status: 'pending' },
      { id: 3, student_id: 'CG-2381', risk_score: 54, risk_level: 'Medium', top_factors: ['Sleep deficit (5.5h)', 'Midterm pressure'], trend: 'stable', status: 'pending' },
      { id: 4, student_id: 'CG-3015', risk_score: 48, risk_level: 'Medium', top_factors: ['Workload spike', 'Mild fatigue'], trend: 'improving', status: 'reviewed' },
      { id: 5, student_id: 'CG-5520', risk_score: 22, risk_level: 'Low', top_factors: ['Balanced routine', 'Regular sleep'], trend: 'stable', status: 'reviewed' }
    ];

    function App() {
      const [tab, setTab] = useState('landing');
      const [lang, setLang] = useState('en');
      const [offline, setOffline] = useState(false);
      const [alerts, setAlerts] = useState(INITIAL_ALERTS);
      const [selectedAlert, setSelectedAlert] = useState(null);

      const t = translations[lang];

      return (
        <div className="min-h-screen flex flex-col bg-[#f8fafc]">
          {/* Demo Banner */}
          <div className="bg-slate-900 text-slate-200 text-xs py-2 px-4 border-b border-slate-800">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded-full font-bold bg-brand-500/20 text-brand-300 border border-brand-500/30 text-[10px]">
                  Demo Mode Active
                </span>
                <span className="text-slate-300 text-xs">All displayed student data is synthetic demo data.</span>
              </div>
              <span className="hidden sm:inline text-slate-400 text-xs">
                Safety Net Architecture • Non-Diagnostic Heuristic
              </span>
            </div>
          </div>

          {/* Navigation */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setTab('landing')}>
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-500 flex items-center justify-center text-white font-black text-lg shadow-sm">
                  🛡️
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-slate-900 tracking-tight text-base">CampusGuard</span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 border border-brand-200">
                      Early-Warning
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">Opt-In Student Wellbeing</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1 text-xs font-semibold">
                {[
                  { id: 'landing', label: t.navOverview },
                  { id: 'checkin', label: t.navCheckin },
                  { id: 'wellbeing', label: t.navWellbeing },
                  { id: 'admin', label: t.navAdmin, highlight: true },
                  { id: 'socialGraph', label: t.navCommunityGraph },
                  { id: 'support', label: t.navSupport },
                  { id: 'resources', label: t.navResources },
                  { id: 'privacy', label: t.navPrivacy },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`px-3 py-1.5 rounded-lg transition-colors ${
                      tab === item.id
                        ? 'bg-slate-100 text-slate-900 shadow-sm'
                        : item.highlight
                        ? 'text-brand-600 font-bold hover:bg-brand-50'
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => setOffline(!offline)}
                  className={`px-2.5 py-1 rounded-lg text-xs font-semibold border flex items-center gap-1.5 ${
                    offline ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                  }`}
                >
                  <span>{offline ? '⚠️ Offline Mode' : '🟢 Online'}</span>
                </button>

                <select
                  value={lang}
                  onChange={(e) => setLang(e.target.value)}
                  className="text-xs font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none cursor-pointer text-slate-700"
                >
                  <option value="en">EN (English)</option>
                  <option value="hi">HI (हिन्दी)</option>
                  <option value="mr">MR (मराठी)</option>
                </select>
              </div>
            </div>
          </header>

          {/* Content Views */}
          <main className="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
            {tab === 'landing' && <LandingView t={t} onNavigate={setTab} />}
            {tab === 'checkin' && <CheckinView t={t} onNavigate={setTab} offline={offline} />}
            {tab === 'wellbeing' && <WellbeingView t={t} onNavigate={setTab} />}
            {tab === 'admin' && <AdminView t={t} alerts={alerts} onSelectAlert={setSelectedAlert} onNavigate={setTab} />}
            {tab === 'socialGraph' && <SocialGraphView t={t} onNavigate={setTab} />}
            {tab === 'support' && <SupportChatView />}
            {tab === 'resources' && <ResourcesView />}
            {tab === 'privacy' && <PrivacyView />}
          </main>

          {/* Alert Side Panel */}
          {selectedAlert && (
            <AlertDrawer
              alert={selectedAlert}
              onClose={() => setSelectedAlert(null)}
              onUpdateStatus={(id, newStatus) => {
                setAlerts(prev => prev.map(a => a.id === id ? { ...a, status: newStatus } : a));
                setSelectedAlert(null);
              }}
            />
          )}

          {/* Footer */}
          <footer className="border-t border-slate-200 bg-white py-6 px-4 text-xs text-slate-500 mt-auto">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>
                <span className="font-bold text-slate-800">CampusGuard</span> — <em>"{t.tagline}"</em>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setTab('privacy')} className="hover:text-slate-900">Privacy Architecture</button>
                <span>•</span>
                <button onClick={() => setTab('resources')} className="hover:text-slate-900">Emergency Helplines</button>
                <span>•</span>
                <span className="text-slate-400">Standalone Single-File Edition</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function LandingView({ t, onNavigate }) {
      return (
        <div className="space-y-16 py-8">
          <div className="max-w-4xl mx-auto text-center space-y-5">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-50 border border-brand-200 text-brand-700 text-xs font-semibold">
              <span>✨ Opt-In Early-Warning Architecture</span>
              <span>•</span>
              <span className="font-normal">Zero Stigma</span>
            </div>
            <h1 className="text-4xl sm:text-6xl font-extrabold text-slate-900 tracking-tight leading-tight">
              Early signals. <br/>
              <span className="bg-gradient-to-r from-brand-600 via-indigo-600 to-violet-600 bg-clip-text text-transparent">
                Earlier support.
              </span>
            </h1>
            <p className="text-slate-600 text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
              {t.tagline} {t.heroSubtitle}
            </p>
            <div className="flex flex-wrap items-center justify-center gap-3 pt-4">
              <button onClick={() => onNavigate('checkin')} className="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md transition-all">
                {t.startCheckin} &rarr;
              </button>
              <button onClick={() => onNavigate('admin')} className="px-6 py-3 rounded-xl bg-white hover:bg-slate-50 text-slate-800 font-bold text-sm border border-slate-300 shadow-sm transition-all">
                {t.viewDashboard}
              </button>
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-6 rounded-3xl bg-white border border-slate-200 shadow-xl">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-rose-400"></span>
                <span className="w-3 h-3 rounded-full bg-amber-400"></span>
                <span className="w-3 h-3 rounded-full bg-emerald-400"></span>
                <span className="text-xs font-bold text-slate-600 ml-2">Campus Wellness Command Center Live Preview</span>
              </div>
              <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-bold border border-emerald-200">
                Heuristic Engine Active
              </span>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Active Students</p>
                <p className="text-2xl font-black text-slate-900 mt-1">1,248</p>
                <p className="text-[10px] text-emerald-600 font-bold mt-0.5">94% opt-in</p>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p className="text-[10px] font-bold text-slate-400 uppercase">Check-ins Today</p>
                <p className="text-2xl font-black text-slate-900 mt-1">842</p>
                <p className="text-[10px] text-slate-500 font-bold mt-0.5">67.5% volume</p>
              </div>
              <div className="p-4 rounded-2xl bg-amber-50/70 border border-amber-200">
                <p className="text-[10px] font-bold text-amber-800 uppercase">Needing Attention</p>
                <p className="text-2xl font-black text-amber-900 mt-1">73</p>
                <p className="text-[10px] text-amber-700 font-bold mt-0.5">Mild stress</p>
              </div>
              <div className="p-4 rounded-2xl bg-rose-50/70 border border-rose-200">
                <p className="text-[10px] font-bold text-rose-800 uppercase">High Priority</p>
                <p className="text-2xl font-black text-rose-900 mt-1">18</p>
                <p className="text-[10px] text-rose-700 font-bold mt-0.5">Review required</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CheckinView({ t, onNavigate, offline }) {
      const [step, setStep] = useState(1);
      const [mood, setMood] = useState(3);
      const [sleep, setSleep] = useState(6.0);
      const [study, setStudy] = useState(7.5);
      const [isolation, setIsolation] = useState('Sometimes isolated');
      const [attendance, setAttendance] = useState(80);
      const [result, setResult] = useState(null);

      const evaluateRisk = () => {
        let score = 0;
        let factors = [];
        if (sleep < 5.0) { score += 32; factors.push('Severe sleep deficit (< 5.0 hrs)'); }
        else if (sleep < 6.5) { score += 18; factors.push('Mild sleep deficit (< 6.5 hrs)'); }
        if (study >= 10.0) { score += 26; factors.push('High study workload (10+ hrs)'); }
        if (mood === 1) { score += 28; factors.push('Very low mood'); }
        else if (mood === 2) { score += 18; factors.push('Low mood'); }
        if (isolation === 'Often isolated') { score += 22; factors.push('Frequent social isolation'); }
        else if (isolation === 'Sometimes isolated') { score += 10; factors.push('Occasional isolation'); }
        if (attendance < 75) { score += 15; factors.push('Attendance below 75%'); }

        score = Math.min(100, Math.max(0, score));
        let level = score >= 68 ? 'High' : (score >= 35 ? 'Medium' : 'Low');
        let status = score >= 68 ? 'Support Recommended' : (score >= 35 ? 'Needs Attention' : 'Stable');
        let rec = score >= 68
          ? 'Your recent pattern indicates noticeable stress and sleep deficit. Consider taking a rest pause or reaching out to a counselor.'
          : (score >= 35 ? 'You are carrying noticeable workload. Pacing assignments and getting extra sleep will help reset energy.' : 'Your wellbeing metrics reflect a healthy and sustainable balance. Keep it up!');

        setResult({ score, level, status, factors, rec });
      };

      if (result) {
        return (
          <div className="max-w-xl mx-auto p-6 sm:p-8 rounded-3xl bg-white border border-slate-200 shadow-xl my-6">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <div>
                <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Wellbeing Status</p>
                <h2 className="text-2xl font-black text-slate-900 mt-1">{result.status}</h2>
              </div>
              <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-black ${
                result.level === 'High' ? 'bg-rose-100 text-rose-800' : (result.level === 'Medium' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800')
              }`}>
                {result.score}<span className="text-[10px] font-normal">/100</span>
              </div>
            </div>

            {offline && (
              <div className="my-4 p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-800">
                ⚠️ Saved locally in Offline Queue. Will sync when online.
              </div>
            )}

            <div className="mt-6 space-y-2">
              <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Contributing Factors</p>
              <div className="flex flex-wrap gap-1.5">
                {result.factors.map((f, i) => (
                  <span key={i} className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-semibold">
                    {f}
                  </span>
                ))}
              </div>
            </div>

            <div className="mt-6 p-4 rounded-2xl bg-brand-50 border border-brand-100 text-xs sm:text-sm text-slate-700 leading-relaxed">
              <strong className="text-brand-800 block mb-1">Supportive Guidance:</strong>
              {result.rec}
            </div>

            <div className="mt-8 flex items-center justify-between pt-4 border-t border-slate-100">
              <button onClick={() => { setResult(null); setStep(1); }} className="text-xs font-bold text-slate-500 hover:text-slate-800">
                ← Take Another Check-in
              </button>
              <button onClick={() => onNavigate('wellbeing')} className="px-4 py-2 rounded-xl bg-brand-600 text-white font-bold text-xs">
                View Trends &rarr;
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-xl mx-auto p-6 sm:p-8 rounded-3xl bg-white border border-slate-200 shadow-card my-6">
          <div className="mb-6">
            <div className="flex justify-between text-xs font-bold text-slate-400 mb-2">
              <span>Step {step} of 5</span>
              <span>{Math.round((step/5)*100)}%</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-1.5">
              <div className="bg-brand-600 h-1.5 rounded-full transition-all" style={{ width: `${(step/5)*100}%` }}></div>
            </div>
          </div>

          {step === 1 && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-slate-900">How are you feeling today?</h2>
              <div className="grid grid-cols-5 gap-2">
                {[
                  { v: 1, e: '😔', l: 'Very Low' },
                  { v: 2, e: '🙁', l: 'Low' },
                  { v: 3, e: '😐', l: 'Okay' },
                  { v: 4, e: '🙂', l: 'Good' },
                  { v: 5, e: '😊', l: 'Great' }
                ].map(item => (
                  <button
                    key={item.v}
                    onClick={() => setMood(item.v)}
                    className={`p-3 rounded-2xl border text-center transition-all ${
                      mood === item.v ? 'border-brand-600 bg-brand-50 ring-2 ring-brand-500' : 'border-slate-200 bg-white hover:bg-slate-50'
                    }`}
                  >
                    <span className="text-3xl block mb-1">{item.e}</span>
                    <span className="text-[10px] font-bold text-slate-700 block">{item.l}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-4 text-center">
              <h2 className="text-lg font-bold text-slate-900">How many hours did you sleep last night?</h2>
              <div className="text-5xl font-black text-slate-900 my-4">{sleep} <span className="text-sm text-slate-400 font-normal">hours</span></div>
              <input type="range" min="0" max="14" step="0.5" value={sleep} onChange={e => setSleep(parseFloat(e.target.value))} className="w-full accent-brand-600" />
            </div>
          )}

          {step === 3 && (
            <div className="space-y-4 text-center">
              <h2 className="text-lg font-bold text-slate-900">How intense was your study or workload?</h2>
              <div className="text-5xl font-black text-slate-900 my-4">{study} <span className="text-sm text-slate-400 font-normal">hours</span></div>
              <input type="range" min="0" max="16" step="0.5" value={study} onChange={e => setStudy(parseFloat(e.target.value))} className="w-full accent-brand-600" />
            </div>
          )}

          {step === 4 && (
            <div className="space-y-3">
              <h2 className="text-lg font-bold text-slate-900">How connected have you felt to people around you?</h2>
              {['Connected', 'Sometimes isolated', 'Often isolated'].map(opt => (
                <button
                  key={opt}
                  onClick={() => setIsolation(opt)}
                  className={`w-full p-4 rounded-2xl border text-left font-bold text-sm transition-all ${
                    isolation === opt ? 'border-brand-600 bg-brand-50 ring-1 ring-brand-500' : 'border-slate-200 bg-white hover:bg-slate-50'
                  }`}
                >
                  {opt}
                </button>
              ))}
            </div>
          )}

          {step === 5 && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-slate-900">Class Attendance & Thoughts</h2>
              <div>
                <div className="flex justify-between text-xs font-bold text-slate-600 mb-1">
                  <span>Estimated Attendance</span>
                  <span>{attendance}%</span>
                </div>
                <input type="range" min="0" max="100" step="5" value={attendance} onChange={e => setAttendance(parseInt(e.target.value))} className="w-full accent-brand-600" />
              </div>
              <textarea placeholder="Optional: Write anything on your mind today..." className="w-full text-xs p-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-brand-500" rows="3"></textarea>
              <div className="p-3 rounded-xl bg-slate-50 text-[11px] text-slate-500">

    function SupportChatView() {
      const [messages, setMessages] = useState([
        { sender: 'bot', text: "Hello! I am CampusGuard Support. You can talk freely about academic stress, heavy workload, sleep trouble, or feeling isolated. How are you holding up?" }
      ]);
      const [input, setInput] = useState('');

      const send = (msg) => {
        const text = msg || input;
        if (!text.trim()) return;

        const newMessages = [...messages, { sender: 'user', text }];
        setMessages(newMessages);
        setInput('');

        setTimeout(() => {
          let reply = "Thank you for sharing. Remember that taking short 10-minute pauses and reaching out to one peer can help reset mental fatigue.";
          let crisis = false;

          const lower = text.toLowerCase();
          if (lower.includes('suicide') || lower.includes('kill myself') || lower.includes('die')) {
            reply = "Please know that you are not alone and your life matters deeply. Trained counselors are available 24/7 right now: Please call Tele-MANAS at 14416 (Govt of India Toll-Free) or KIRAN at 1800-599-0019 immediately.";
            crisis = true;
          } else if (lower.includes('lonely') || lower.includes('isolated')) {
            reply = "Feeling disconnected can be very difficult. Consider sending a quick message to one person you trust or dropping by the campus student center today.";
          } else if (lower.includes('exam') || lower.includes('stress')) {
            reply = "Academic pressure can feel overwhelming. Let's break it down: Pick just one single task for the next 25 minutes, then take a real break away from screens.";
          }

          setMessages([...newMessages, { sender: 'bot', text: reply, crisis }]);
        }, 500);
      };

      return (
        <div className="max-w-3xl mx-auto p-6 rounded-3xl bg-white border border-slate-200 shadow-card h-[540px] flex flex-col justify-between">
          <div className="border-b border-slate-100 pb-3 flex justify-between items-center">
            <div>
              <h2 className="text-base font-bold text-slate-900">CampusGuard Support</h2>
              <p className="text-xs text-slate-400">Empathetic, non-clinical supportive space</p>
            </div>
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          </div>

          <div className="flex-1 overflow-y-auto space-y-3 py-4 pr-1">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`p-3.5 rounded-2xl max-w-md text-xs sm:text-sm leading-relaxed ${
                  m.sender === 'user' ? 'bg-brand-600 text-white rounded-tr-sm' : (m.crisis ? 'bg-rose-50 border border-rose-200 text-rose-950 font-bold rounded-tl-sm' : 'bg-slate-100 text-slate-800 rounded-tl-sm')
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
          </div>

          <div>
            <div className="flex gap-1.5 overflow-x-auto pb-2 text-xs">
              {["I'm stressed about exams.", "I feel lonely.", "I haven't slept well."].map((p, idx) => (
                <button key={idx} onClick={() => send(p)} className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 whitespace-nowrap">
                  {p}
                </button>
              ))}
            </div>

            <form onSubmit={(e) => { e.preventDefault(); send(); }} className="flex gap-2 pt-2 border-t border-slate-100">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                placeholder="Share what is currently on your mind..."

                  <h3 className="text-base font-bold text-slate-900 mt-2">{r.title}</h3>
                  <p className="text-xs text-slate-600 mt-1 leading-relaxed">{r.desc}</p>
                </div>
                <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs font-bold">
                  <span className="text-slate-800">{r.phone}</span>
                  {r.cat === 'Emergency' && (
                    <a href={`tel:${r.phone.replace(/[^0-9]/g, '')}`} className="px-3 py-1 rounded-lg bg-rose-600 text-white">Call</a>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PrivacyView() {
      return (
        <div className="max-w-4xl mx-auto space-y-8 py-6">
          <div className="text-center space-y-3">
            <h1 className="text-3xl font-extrabold text-slate-900">Your wellbeing data belongs to you.</h1>
            <p className="text-slate-600 text-sm max-w-xl mx-auto">
              CampusGuard was built on the principle that students will only trust a wellbeing tool if it is fundamentally safe and free from surveillance.
            </p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            {[
              { t: '1. 100% Opt-In Participation', d: 'Students choose voluntarily whether to participate and can delete their records anytime.' },
              { t: '2. Anonymous Student IDs', d: 'All check-ins and graphs use codes like CG-1042. Real names and roll numbers are never linked.' },
              { t: '3. Strictly Non-Diagnostic', d: 'We identify pattern changes like sleep drops, never clinical medical diagnoses.' },
              { t: '4. Zero Surveillance', d: 'No keystroke logging, no screen recording, no location tracking, and no private message reading.' },
              { t: '5. Minimal Data Collection', d: 'Only 5 functional indicators: mood, sleep, study hours, attendance estimate, and peer connection.' },
              { t: '6. Mandatory Human Oversight', d: 'Automated algorithms never trigger punitive action. Human counselors review alerts before intervention.' }
            ].map((p, i) => (
              <div key={i} className="p-5 rounded-2xl bg-white border border-slate-200 shadow-card">
                <h3 className="font-bold text-slate-900 text-sm mb-1">{p.t}</h3>
                <p className="text-slate-600 leading-relaxed">{p.d}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
